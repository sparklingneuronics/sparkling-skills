<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="A second opinion without leaving Claude Code: you ask codex whether a client reply is too blunt, codex flags a condescending phrase, Claude softens it.">
  <rect x="8" y="8" width="864" height="384" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <!-- title bar -->
  <circle cx="36" cy="40" r="6" fill="#ff5f56"/>
  <circle cx="56" cy="40" r="6" fill="#febc2e"/>
  <circle cx="76" cy="40" r="6" fill="#28c840"/>
  <text x="104" y="45" fill="#8b949e" font-size="14" font-family="system-ui, -apple-system, Segoe UI, sans-serif">dispatch &#8212; a second opinion, without leaving Claude Code</text>
  <line x1="24" y1="66" x2="856" y2="66" stroke="#21262d" stroke-width="1"/>

  <!-- beat 1: you -->
  <rect x="28" y="90" width="54" height="26" rx="13" fill="#1f6feb" fill-opacity="0.16" stroke="#388bfd" stroke-opacity="0.5"/>
  <text x="55" y="108" fill="#58a6ff" font-size="13" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif">you</text>
  <text x="100" y="109" fill="#c9d1d9" font-size="15">is this reply to the client too blunt? see what codex thinks</text>

  <!-- beat 2: codex -->
  <rect x="28" y="156" width="68" height="26" rx="13" fill="#3fb950" fill-opacity="0.16" stroke="#3fb950" stroke-opacity="0.5"/>
  <text x="62" y="174" fill="#3fb950" font-size="13" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif">codex</text>
  <text x="100" y="175" fill="#c9d1d9" font-size="15"><tspan fill="#e3b341">"As I already explained"</tspan> reads as condescending &#8212;</text>
  <text x="100" y="201" fill="#c9d1d9" font-size="15">it'll put them on the defensive.</text>

  <!-- beat 3: claude -->
  <rect x="28" y="250" width="74" height="26" rx="13" fill="#f0883e" fill-opacity="0.16" stroke="#f0883e" stroke-opacity="0.5"/>
  <text x="65" y="268" fill="#f0883e" font-size="13" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif">claude</text>
  <text x="100" y="269" fill="#c9d1d9" font-size="15">Agreed &#8212; softening to "to recap from my last note".</text>

  <!-- footer -->
  <text x="100" y="360" fill="#6e7681" font-size="12.5" font-family="system-ui, -apple-system, Segoe UI, sans-serif">/codex &#183; /agy &#8212; name the tool, get a peer's take</text>
  <text x="848" y="360" fill="#6e7681" font-size="12.5" text-anchor="end" font-family="system-ui, -apple-system, Segoe UI, sans-serif">sparkling-skills</text>
</svg>
